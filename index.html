<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src='//libtl.com/sdk.js' data-zone='11923640' data-sdk='show_11923640'></script>
    
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">

    <h1>Welcome to My Mini App</h1>
    <p>Earn rewards by watching ads!</p>

    <!-- Ad Show করার বাটন -->
    <button id="ad-btn" style="padding: 12px 24px; font-size: 16px; background-color: #0088cc; color: white; border: none; border-radius: 8px;">
        Watch Ad
    </button>

    <script>
        // Telegram WebApp ইনিশিয়ালাইজ করা
        const tg = window.Telegram.WebApp;
        tg.expand(); // অ্যাপটি ফুলস্ক্রিন করা

        // বাটনে ক্লিক করলে কী হবে
        document.getElementById('ad-btn').addEventListener('click', function() {
            alert('Ad is loading...');
            // Monetag Ad Call Function (এখানে আপনার অ্যাড দেখানোর ফাংশন থাকবে)
        });
    </script>
</body>
</html>
