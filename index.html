<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Zone Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --gold-color: #f59e0b;
            --green-color: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
        }

        .header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #334155;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #000;
        }

        .user-info h3 {
            font-size: 15px;
        }

        .user-info p {
            font-size: 12px;
            color: #94a3b8;
        }

        .balance-card {
            text-align: center;
            margin: 30px 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .balance-title {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold-color);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-content {
            display: none;
            padding: 0 20px;
        }

        .tab-content.active {
            display: block;
        }

        .tap-area {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .tap-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, #0284c7 0%, #0f172a 100%);
            border: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s ease;
        }

        .tap-btn:active {
            transform: scale(0.92);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-info i {
            font-size: 22px;
            color: var(--accent-color);
        }

        .btn-action {
            background: var(--green-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-action:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #334155;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>

        <div class="avatar
